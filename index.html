    <script>
      if (typeof window !== 'undefined') {
        window.process = window.process || {};
        window.process.env = window.process.env || {};
      }
      
      // Global function to hide and remove the initial loader
      window.hideAppLoader = function() {
        const loader = document.getElementById('app-loader');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.pointerEvents = 'none';
          setTimeout(function() {
            if (loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
          }, 200);
        }
      };

      // Register Service Worker with relative path (./sw.js) for GitHub Pages subpath support (e.g. /tho/)
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        function bootAfterSW() {
          setTimeout(function() {
            if (!window.__APP_MOUNTED__) {
              import('./index.tsx?t=' + Date.now()).catch(function() {
                if (!window.__APP_MOUNTED__ && !sessionStorage.getItem('sw_reloaded')) {
                  sessionStorage.setItem('sw_reloaded', '1');
                  window.location.reload();
                }
              });
            }
          }, 250);
        }

        navigator.serviceWorker.addEventListener('controllerchange', bootAfterSW, { once: true });
        navigator.serviceWorker.register('./sw.js').then(function() {
          return navigator.serviceWorker.ready;
        }).then(function() {
          if (navigator.serviceWorker.controller && !window.__APP_MOUNTED__) {
            bootAfterSW();
          }
        }).catch(function(err) {
          console.warn('SW registration info:', err);
        });
      }

      // Failsafe auto-dismiss loader after 4s
      window.addEventListener('load', function() {
        setTimeout(window.hideAppLoader, 4000);
      });
    </script>
    <style>
      body { font-family: 'Cairo', system-ui, -apple-system, sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
      #app-loader {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: white; display: flex; flex-direction: column;
        align-items: center; justify-content: center; z-index: 9999;
        transition: opacity 0.25s ease-out;
      }
      .spinner {
        width: 44px; height: 44px; border: 4px solid #f1f5f9;
        border-top: 4px solid #0891b2; border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app-loader">
      <div class="spinner"></div>
      <p style="margin-top: 16px; font-weight: 700; color: #334155; font-size: 15px;">جاري تحميل النظام...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
