    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

    <!-- Firebase Scripts (needed for Compat DB) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

    <script>
      if (typeof window !== 'undefined') {
        window.process = window.process || {};
        window.process.env = window.process.env || {};
      }
      
      // Global function to hide and remove the initial loader
      window.hideAppLoader = function() {
        const loader = document.getElementById('app-loader');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.pointerEvents = 'none';
          setTimeout(function() {
            if (loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
          }, 200);
        }
      };

      // Failsafe auto-dismiss
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(window.hideAppLoader, 1000);
      });
      window.addEventListener('load', function() {
        setTimeout(window.hideAppLoader, 300);
      });

      // Unregister any legacy service workers that might intercept .ts/.tsx files in production
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        }).catch(function(err) {
          console.warn('SW cleanup info:', err);
        });
      }
    </script>
    <style>
      body { font-family: 'Cairo', system-ui, sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
      #app-loader {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: white; display: flex; flex-direction: column;
        align-items: center; justify-content: center; z-index: 9999;
        transition: opacity 0.25s ease-out;
      }
      .spinner {
        width: 44px; height: 44px; border: 4px solid #f1f5f9;
        border-top: 4px solid #0891b2; border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="app-loader">
      <div class="spinner"></div>
      <p style="margin-top: 16px; font-weight: 700; color: #334155; font-size: 15px;">جاري تحميل النظام...</p>
    </div>
    <div id="root"></div>
    <script>
      window.hideAppLoader = function() {
        const loader = document.getElementById('app-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => { loader.style.display = 'none'; }, 250);
        }
      };
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
